[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-analytics-prototype"
version = "0.1.0"
requires-python = ">=3.10"
description = "Charge-only SoH and RUL laboratory prototype with grouped validation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
